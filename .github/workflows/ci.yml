name: ci
on:
  push:
    branches: [main, v1-production]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and fixture tests (stdlib only)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Executable evals (29 rows; behavioural rows are graded on the recorded transcripts)
        run: cd tools && python -m specalign eval --transcripts ../evals/runs/2026-11-02 --require-all
        shell: bash
      - name: Installer round trip
        run: python install.py --home "$RUNNER_TEMP/home" --global-only && python install.py --home "$RUNNER_TEMP/home" --global-only --check
        shell: bash
